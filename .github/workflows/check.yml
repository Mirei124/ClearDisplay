name: Check
on:
  push:
  pull_request:

jobs:
  build-and-lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Check formatting and build
        run: ./check.sh
